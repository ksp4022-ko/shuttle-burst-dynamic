name: Deploy Shuttle Dynamics to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Type errors fail this job before anything is built or uploaded, so
      # the deploy job (needs: build) never runs.
      - name: TypeScript check
        run: npx tsc --noEmit --pretty false

      - name: Build static site
        run: npm run build

      - name: Verify prerender output
        run: |
          test -f dist/client/index.html
          cp dist/client/index.html dist/client/404.html
          mkdir -p dist/client/rian dist/client/kangxuan dist/client/v8 dist/client/v8/rian dist/client/v8/kangxuan
          cp dist/client/index.html dist/client/rian/index.html
          cp dist/client/index.html dist/client/kangxuan/index.html
          cp dist/client/index.html dist/client/v8/index.html
          cp dist/client/index.html dist/client/v8/rian/index.html
          cp dist/client/index.html dist/client/v8/kangxuan/index.html
          # /v8test/* = V8 test route family (same app, see v8-route-family).
          mkdir -p dist/client/v8test dist/client/v8test/rian dist/client/v8test/kangxuan
          cp dist/client/index.html dist/client/v8test/index.html
          cp dist/client/index.html dist/client/v8test/rian/index.html
          cp dist/client/index.html dist/client/v8test/kangxuan/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
